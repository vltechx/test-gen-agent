name: AI test generation (Semantic Kernel)

on:
  pull_request:
    paths:
      - "semantic-kernel-agent/**"
      - "sample-ts/src/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  sk-generate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test project dependencies
        run: cd sample-ts && npm install

      - name: Run Semantic Kernel agent
        working-directory: semantic-kernel-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: dotnet run | tee ../sk-agent-output.txt

      - name: Comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Semantic Kernel test generation result"
            echo '```'
            tail -n 40 sk-agent-output.txt
            echo '```'
          } > sk-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file sk-comment.md